; ================================================================
; player_card/platformio.ini
; Board  : Seeed XIAO ESP32S3
; Target : Monopoly Player Card - full game
;
; Flash P1 with: pio run -e xiao_esp32s3_p1 -t upload
; Flash P2 with: pio run -e xiao_esp32s3_p2 -t upload
; ================================================================

[common]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=5120

lib_deps =
    adafruit/Adafruit SSD1351 library @ ^1.3.2
    adafruit/Adafruit GFX Library     @ ^1.11.9
    adafruit/Adafruit PN532           @ ^1.3.2
    h2zero/NimBLE-Arduino             @ ^1.4.3

[env:xiao_esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
board_build.partitions = min_spiffs.csv

build_flags =
    ${common.build_flags}
    -DPLAYER_NUM=2

lib_deps = ${common.lib_deps}

[env:xiao_esp32s3_p1]
extends = env:xiao_esp32s3
build_flags =
    ${common.build_flags}
    -DPLAYER_NUM=1

[env:xiao_esp32s3_p2]
extends = env:xiao_esp32s3
build_flags =
    ${common.build_flags}
    -DPLAYER_NUM=2
