; ================================================================
; PlatformIO Project Configuration
; Board  : Seeed XIAO ESP32S3
; Target : Monopoly Player Device (breadboard prototype)
; ================================================================

[env:xiao_esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; ── Serial monitor ──────────────────────────────────────────────
monitor_speed = 115200

; ── Build flags ─────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── Libraries ───────────────────────────────────────────────────
; Adafruit SSD1351 color OLED driver (128x128)
; Adafruit GFX is pulled in automatically as a dependency
; Adafruit PN532 NFC reader (I2C mode)
lib_deps =
    adafruit/Adafruit SSD1351 library @ ^1.3.2
    adafruit/Adafruit GFX Library     @ ^1.11.9
    adafruit/Adafruit PN532           @ ^1.3.2
